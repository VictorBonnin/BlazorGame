services:
  # --- 1. KEYCLOAK (Authentification) ---
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    container_name: blazorgame-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ./Keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json

  # --- 2. API (GameServices) - Port 5001 ---
  game-api:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    container_name: blazorgame-api
    working_dir: /app/GameServices
    command: dotnet watch run --urls=http://0.0.0.0:5001
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=1
    volumes:
      - ./:/app 
    depends_on:
      - keycloak

  # --- 3. BLAZOR CLIENT - Port 5000 ---
  blazor-client:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    container_name: blazorgame-client
    working_dir: /app/BlazorGame.Client
    command: dotnet watch run --urls=http://0.0.0.0:5000
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=1
    volumes:
      - ./:/app
    depends_on:
      - game-api